# closure-gate — server-side finish line for spec CLOSURES (P1246).
#
# WHY THIS IS THE REAL BOUNDARY
# git-ops.sh now runs ship-gates.sh from the closing path, and a PreToolUse hook
# blocks a hand-rolled `git mv` into features/done/. Both are LOCAL, and a local
# control is forgeable by the party it binds — the same reasoning goal-gate.yml
# and privacy-scan.yml are built on. This job re-derives the verdict from the
# pushed commits, so a close that ducked the local path still has to answer for
# itself here.
#
# Load-bearing design notes (mirrors goal-gate.yml deliberately):
#  - The gate script (and, since P1444, scripts/lib/admin-close.sh) is fetched
#    from the event range's BASE — what main was before this change — never from
#    the pushed copy, so a change that weakens either cannot weaken the gate that
#    judges it. A base without ship-gates.sh fails the job.
#  - P1444: a close that fails gate 2.5 may still pass as an ADMINISTRATIVE close
#    (comment / withdrawn / retracted spec), re-derived from the committed blobs of
#    the closing commit, its parent and the range base. No trailer is read for it.
#  - Gate 2.5 ONLY. Gate 2.7 reads .finish-reviewed, which lives in git-common-dir
#    and is untracked — it does not exist on a runner. Running it here would fail
#    every close for a reason unrelated to the close, and a check that always
#    fails is a check people route around.
#  - --spec-file is required: by the time a close is pushed, the spec has already
#    MOVED to features/done/<sprint>/, where ship-gates' resolver deliberately
#    does not look. Without it this job could only ever report "spec not found".
#  - BLOCKING, never alert-only: no continue-on-error.
#  - permissions: contents: read ONLY. Actions publishes the check-run result
#    itself; a token cannot POST a forged one.
#
# KNOWN RESIDUAL, stated rather than implied away: the human override is carried
# by a `Gate-Override:` trailer on the closing commit, and a commit message is
# writable by whoever makes the commit. This job therefore cannot distinguish a
# founder's terminal override from a forged trailer. What it DOES do is convert a
# silent false close into a loud, greppable, permanent claim that a human
# authorized this one — reviewable in `git log`, and impossible to produce at all
# without first defeating the local PreToolUse hook. That is a real improvement
# over the measured baseline (no gate at any layer), not a proof of authenticity.

name: closure-gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  closure-gate:
    name: closure-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Fetch trusted base (origin/main)
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin main:refs/remotes/origin/main \
            || git fetch --no-tags --quiet origin main

      - name: Identify specs closed by this change
        id: closed
        env:
          # Read through env, never interpolated into the script body.
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          # A close = a spec file ADDED under features/done/ (UAT copies excluded:
          # they travel with their spec and are not closes of their own).
          # --no-renames + --diff-filter=A on the done/ side catches the move's
          # destination without depending on rename detection.
          #
          # THE RANGE IS THE WHOLE GATE. The first version used
          # `origin/main...HEAD` for every event. On a push to main that is EMPTY
          # BY CONSTRUCTION — once the push lands, origin/main IS HEAD — so the
          # gating step was skipped and the job reported a green that had examined
          # nothing. Verified on run 34211142337: "Gate each closure" skipped,
          # conclusion success. The single run that DID find a spec (34209536521)
          # only did so because the runner's origin/main ref briefly lagged the
          # push: a race, not a design.
          #
          # ONE RANGE, BASE..TIP, for everything downstream (P1444): discovery,
          # the closing-commit lookup, the administrative re-derivation's
          # provenance, and the trusted policy scripts are all read against the
          # same BASE. The closing-commit lookup used to switch back to
          # `origin/main...HEAD`, which on a push to main is empty — so the override
          # trailer was read from no commit at all.
          #   push with a reachable before: BASE = before (what main was).
          #   new branch, unreachable before, pull_request: BASE = merge-base with
          #   origin/main (equal to what the three-dot form diffed against).
          TIP="$(git rev-parse HEAD)"
          BASE=""
          if [ "$EVENT_NAME" = "push" ] \
             && [ -n "${PUSH_BEFORE:-}" ] \
             && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse "${PUSH_BEFORE}^{commit}")"
            TIP="$(git rev-parse "${PUSH_AFTER}^{commit}")"
          else
            BASE="$(git merge-base origin/main HEAD)" || BASE=""
          fi
          if [ -z "$BASE" ]; then
            echo "::error::closure-gate could not establish the event range's base — refusing to report a green that examined nothing."
            exit 1
          fi
          RANGE="${BASE}..${TIP}"
          echo "Range: $RANGE (event: $EVENT_NAME)"
          # git diff runs on its own line so a failure fails the job; piping it
          # straight into `grep || true` used to turn a git error into "no closes".
          DIFF="$(git diff --no-renames --name-only --diff-filter=A "$RANGE" -- 'features/done/**')"
          CLOSED="$(printf '%s\n' "$DIFF" | grep -E '/p[0-9]+[^/]*\.md$' | grep -vE '/uat/' || true)"
          {
            echo "range=$RANGE"
            echo "base=$BASE"
            echo "paths<<EOF"
            echo "$CLOSED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -z "$CLOSED" ]; then
            echo "No spec closures in this change — closure gate does not apply."
          else
            echo "Specs closed here:"; echo "$CLOSED"
          fi

      - name: Gate each closure (trusted-base policy — gate 2.5, or an administrative close re-derived from blobs)
        if: steps.closed.outputs.paths != ''
        env:
          CLOSED: ${{ steps.closed.outputs.paths }}
          RANGE: ${{ steps.closed.outputs.range }}
          BASE: ${{ steps.closed.outputs.base }}
        run: |
          set -euo pipefail
          set -o pipefail   # mandatory: `script | tee` otherwise returns tee's 0
          # POLICY COMES FROM THE RANGE'S BASE, never from the pushed tree. The first
          # version fetched origin/main — which on a push to main IS the pushed
          # commit — and fell back to the pushed copy when the base had none. Both
          # let a change judge itself. A base without the gate script now FAILS.
          #
          # MUST live under the workspace's own scripts/ dir: ship-gates.sh resolves
          # its repo root as `dirname "$0"/..`, so a copy in /tmp resolves to `/`.
          TRUSTED="$GITHUB_WORKSPACE/scripts/.trusted-ship-gates.sh"
          if ! git show "$BASE:scripts/ship-gates.sh" > "$TRUSTED" 2>/dev/null; then
            echo "::error::closure-gate: the range base $BASE has no scripts/ship-gates.sh — refusing to judge closes with the pushed copy."
            exit 1
          fi
          chmod +x "$TRUSTED"
          # The administrative-closure library (P1444), also from the base. Absent
          # there (the push that first lands it), the administrative route simply
          # does not exist for this range — a failing close then fails. Never the
          # pushed copy.
          TRUSTED_ADMIN="$GITHUB_WORKSPACE/scripts/.trusted-admin-close.sh"
          ADMIN_AVAILABLE=0
          if git show "$BASE:scripts/lib/admin-close.sh" > "$TRUSTED_ADMIN" 2>/dev/null; then
            ADMIN_AVAILABLE=1
          else
            rm -f "$TRUSTED_ADMIN"
            echo "Administrative closure is not available at the range base; failing closes are judged by gate 2.5 and the override trailer only."
          fi

          # PROVE THE GATE CAN SEE THE REPO BEFORE TRUSTING ITS VERDICT.
          # The first version of this step wrote the trusted copy to /tmp and ran it
          # there. ship-gates.sh derives its repo root from its OWN location
          # (`dirname "$0"/..`), so from /tmp that resolved to `/`: every git call
          # printed "fatal: not a git repository" and gate 2.5 reported
          # "spec not found" — a FAIL that had nothing to do with the spec. Measured
          # on run 34209536521. That is decisions.md 2026-09-08 [process] exactly
          # ("a gate proven in place is not proven through the path CI actually runs
          # it from"), which this repeated three days later in a different workflow.
          #
          # The self-check must DISCRIMINATE. A first draft asserted only that a
          # "GATE 2.5" line appeared — but the broken /tmp configuration prints
          # "[GATE 2.5] FAIL: spec not found" too, so that probe returned the same
          # verdict for the known-good and known-bad arms and would have waved the
          # broken gate through.
          #
          # Assert the symptom that actually differs: a gate that cannot resolve its
          # repo emits git's "not a git repository". Output is captured, never piped
          # into grep -q — an early-closing consumer under pipefail is its own trap
          # (decisions.md 2026-09-08, pre-commit check 18c).
          selfcheck="$(bash "$TRUSTED" p0 --spec-file /dev/null --only 2.5 2>&1 || true)"
          if printf '%s' "$selfcheck" | grep -q 'not a git repository'; then
            echo "::error::closure-gate self-check FAILED — the trusted gate cannot resolve the repository, so every spec would score as non-compliant for the wrong reason."
            printf '%s\n' "$selfcheck"
            exit 1
          fi
          if ! printf '%s' "$selfcheck" | grep -q 'GATE 2.5'; then
            echo "::error::closure-gate self-check FAILED — the trusted gate produced no gate-2.5 verdict at all."
            printf '%s\n' "$selfcheck"
            exit 1
          fi

          rc=0
          while IFS= read -r spec; do
            [ -z "$spec" ] && continue
            pn=$(basename "$spec" | grep -oE '^p[0-9]+')
            echo "::group::closure-gate $pn ($spec)"
            if bash "$TRUSTED" "$pn" --spec-file "$spec" --only 2.5 2>&1 | tee "gate-$pn.txt"; then
              echo "PASS: $pn"
              echo "::endgroup::"
              continue
            fi
            # The commit that performed this close, looked up in the SAME range
            # that discovered it. `sed -n 1p` reads all of its input, so it cannot
            # SIGPIPE the producer under pipefail the way `head -1` can.
            closing_commit="$(git log --no-renames --diff-filter=A --format='%H' "$RANGE" -- "$spec" | sed -n '1p')"
            if [ -z "$closing_commit" ]; then
              echo "::error::$pn: no commit in $RANGE adds $spec — cannot attribute the close."
              rc=1; echo "::endgroup::"; continue
            fi
            # P1444 ADMINISTRATIVE CLOSE, re-derived from committed blobs with the
            # base's library: the closing commit's parent and its own blob must both
            # classify the spec as comment/withdrawn/retracted with no implementation
            # recorded, the spec must already be classified at BASE (a relabel inside
            # the range refuses), the commit may touch only the spec and its UAT file,
            # and no feature/pN-* or fix/pN-* ref may be ahead of it. NO trailer or
            # message text is read for this verdict.
            if [ "$ADMIN_AVAILABLE" = 1 ]; then
              if admin_out="$(bash -c '. "$1" && if admin_check_commit "$2" "$3" "$4" "$5"; then echo "$ADMIN_MARKER"; else echo "$ADMIN_REASON"; exit 1; fi' \
                                _ "$TRUSTED_ADMIN" "$GITHUB_WORKSPACE" "$pn" "$closing_commit" "$BASE" 2>&1)"; then
                echo "ADMIN: $pn closed administratively ($admin_out) in $closing_commit — re-derived from blobs; gates 2.5 and 2.7 do not apply"
                echo "::endgroup::"; continue
              fi
              echo "Not an administrative close: $admin_out"
            fi
            # A human override is carried by a trailer on that same commit. KNOWN
            # RESIDUAL, unchanged by P1444: a trailer is writable by whoever makes
            # the commit, so this converts a false close into a loud, permanent
            # claim rather than preventing it (see the header).
            reason=$(git log -1 --format='%B' "$closing_commit" 2>/dev/null | grep -m1 '^Gate-Override-Reason:' || true)
            if [ -n "$reason" ]; then
              echo "::warning::$pn closed on a FAILING gate under human override — ${reason#Gate-Override-Reason: }"
              echo "OVERRIDE: $pn ($closing_commit)"
            else
              echo "::error::$pn was closed but does not pass the closure gate, is not an administrative close, and carries no Gate-Override trailer."
              rc=1
            fi
            echo "::endgroup::"
          done <<< "$CLOSED"
          exit $rc

      - name: Canary parity (the gate's own red/green suite)
        if: steps.closed.outputs.paths != ''
        run: bash scripts/test-pipeline-gates.sh

      - name: Dump gate output on failure
        if: failure()
        run: for f in gate-*.txt; do [ -f "$f" ] && { echo "=== $f ==="; cat "$f"; }; done || true
