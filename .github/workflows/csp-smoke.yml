name: CSP smoke (prod)

# Loads the deployed strict-CSP routes in a real browser and fails on any CSP
# violation. Catches the recurring class where a third-party SDK (Mixpanel,
# Mixpanel, Sentry) loads from a host missing from the vercel.json allowlist —
# invisible to every static check because the CSP lives in response headers and
# the blocked host is decided at runtime (a vendor may rotate CDN hosts).
#
# Scheduled because a CDN-hosted vendor can change hosts INDEPENDENTLY of our deploys: prod
# can break with no commit from us. The cron run is the active periodic catch;
# the CSP report-uri → Sentry sink (api/csp-report.ts) is the passive real-user
# backstop. See src/tests/p865-csp-directives.test.ts for the static canary.

on:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours
  workflow_dispatch:
    inputs:
      url:
        description: 'Target URL (defaults to prod)'
        required: false
        default: 'https://claritypledge.com'

permissions:
  contents: read
  issues: write

jobs:
  csp-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run CSP smoke against prod
        env:
          CSP_SMOKE_URL: ${{ github.event.inputs.url || 'https://claritypledge.com' }}
        run: npm run smoke:csp

      # An unwatched gate is no gate: a failing scheduled run dies silently in the Actions
      # tab otherwise, and this cron is the only ACTIVE catch for between-deploy host
      # rotations. Surface it as a GitHub issue (find-or-append, so it doesn't spam).
      # All shell values are built-in env vars / fixed strings — no untrusted input.
      - name: Open a GitHub issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="CSP smoke gate failing on prod"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          existing=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing — $RUN_URL"
          else
            gh issue create --title "$TITLE" \
              --body "The scheduled CSP smoke gate failed. A third-party host may have rotated out of the vercel.json allowlist, or a new CSP violation appeared on prod. Investigate: $RUN_URL"
          fi
