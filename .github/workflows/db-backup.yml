name: Daily DB Backup

on:
  schedule:
    - cron: '0 3 * * *'  # 3am UTC daily
  workflow_dispatch:      # allow manual trigger

# Serialize backups (P991 step 5). A manual trigger landing on top of the 3am
# schedule would otherwise run two concurrent pg_dumps against prod, doubling
# load on the source DB. cancel-in-progress: false — never kill a backup that
# is already streaming; make the newer run wait instead.
concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      issues: write        # find-or-append failure issue (decisions.md 2026-06-06)
    timeout-minutes: 30    # a hung pg_dump otherwise holds the job — and the
                           # concurrency group — for the 360-minute default
    steps:
      - name: Install pg_dump
        run: |
          sudo apt-get install -y gnupg curl
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update && sudo apt-get install -y postgresql-client-17

      - name: Authenticate to GCP
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/865832856153/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: db-backup-writer@gen-lang-client-0869694595.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Run backup
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          DATE=$(date +%Y%m%d-%H%M%S)
          FILENAME="prod-backup-${DATE}.sql.gz"
          echo "Backing up to gs://claritypledge-db-backups/${FILENAME}"
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" | gzip | gsutil cp - "gs://claritypledge-db-backups/${FILENAME}"
          # awk (anchored, first match only) not `grep | awk`: an unanchored match that
          # ever yields TWO lines makes SIZE multi-line, and `[[ multi -lt 1000 ]]` then
          # returns 2 (syntax error). Inside an `if` that is merely falsy and set -e is
          # suppressed in condition context — so the floor silently evaporates and the
          # script exits 0. Fail-OPEN. awk also returns empty rather than exiting 1,
          # which keeps the -z guard below reachable (under pipefail, a failing grep
          # killed the assignment first and the operator got a bare exit 1, no message).
          SIZE=$(gsutil stat "gs://claritypledge-db-backups/${FILENAME}" | awk '/^ *Content-Length:/ {print $2; exit}')
          if [[ -z "${SIZE}" ]]; then echo "ERROR: could not read backup size from gsutil stat" && exit 1; fi
          echo "Backup size: ${SIZE} bytes"
          if [[ "${SIZE}" -lt 1000 ]]; then echo "ERROR: backup suspiciously small (${SIZE} bytes)" && exit 1; fi

          # Integrity check (P991 step 5). The size floor above proves almost nothing:
          # a pg_dump truncated mid-stream still lands as a multi-MB object and sails
          # past it. `set -o pipefail` already catches a pg_dump that EXITS non-zero —
          # what it cannot see is whether the object that actually landed in GCS is
          # complete. So verify the stored object, not the exit code:
          #   1. gunzip -t  — the gzip stream is whole (catches truncation/corruption)
          #   2. footer     — the SQL ends with pg_dump's completion marker (catches a
          #                   dump that stopped early but still produced valid gzip)
          # Deliberately NOT "compare size to the previous backup": that needs list on
          # the bucket, and db-backup-writer is scoped to create+get only (see below).
          # Verifying the object we just wrote needs only `get`.
          echo "Verifying stored backup..."
          gsutil cp "gs://claritypledge-db-backups/${FILENAME}" /tmp/verify.sql.gz
          if ! gunzip -t /tmp/verify.sql.gz 2>/dev/null; then
            echo "ERROR: stored backup failed gzip integrity check — truncated or corrupt"
            exit 1
          fi
          # Two statements, not one pipeline. `gunzip -c ... | grep -q` under pipefail
          # reports FAILURE on a perfectly healthy file — grep -q exits at the first
          # match and SIGPIPEs the writer (verified). At tail -c 200 it happens not to
          # fire, because grep reads the whole window before deciding. Capturing first
          # keeps the trap out of the pipeline entirely, so widening this window later
          # can't silently invert the check.
          # ANCHORED (^...$). Unanchored, this matches the phrase ANYWHERE in the last
          # 200 bytes — including inside COPY row data. This product stores free text
          # users type, so a dump truncated mid-COPY whose last row happens to contain
          # the phrase would pass as complete. Verified: the forged fixture passes
          # unanchored and is correctly rejected anchored.
          FOOTER=$(gunzip -c /tmp/verify.sql.gz | tail -c 200)
          if ! grep -q '^-- PostgreSQL database dump complete$' <<<"${FOOTER}"; then
            echo "ERROR: stored backup is missing pg_dump's completion footer — dump ended early"
            exit 1
          fi
          rm -f /tmp/verify.sql.gz
          echo "Verified: gzip stream intact, pg_dump footer present."
          echo "Done."

      # Alerting per decisions.md 2026-06-06 [process]: scheduled gates route to a
      # find-or-append GitHub issue the agent reads via /day, NOT the founder's inbox.
      # This workflow guards the only copy of prod data and had NO alerting at all —
      # a failed backup was a red X in the Actions tab that nobody reads.
      #
      # `cancelled()` is deliberate, not defensive. `concurrency` evicts a QUEUED run
      # when a newer one joins the group (cancel-in-progress:false only protects the
      # in-flight run). So: slow dump running + 3am schedule queues + a manual dispatch
      # => the scheduled run is CANCELLED and that day has no backup. A cancelled run's
      # conclusion is `cancelled`, not `failure`, so `if: failure()` alone would leave
      # exactly that silent-skip path silent. A backup that was cancelled is a backup
      # that did not happen.
      - name: Alert on failure or silent skip
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="Daily DB backup failing"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          existing=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing (${{ job.status }}) — $RUN_URL"
          else
            gh issue create --title "$TITLE" \
              --body "The daily prod DB backup did not complete (job status: ${{ job.status }}). Prod data may have no backup for this day. If status is \`cancelled\`, a concurrent run evicted the scheduled one from the backup concurrency group — the backup was skipped, not merely slow. Investigate: $RUN_URL"
          fi
          # 7-day retention is enforced by the bucket's GCS lifecycle rule, not this workflow —
          # keeps db-backup-writer scoped to create+get only (no delete permission needed).
