# Privacy scan — server-side PII gate for the public repo (P919).
#
# This workflow re-runs scripts/audit-privacy.sh against the pushed commit range and
# publishes a check run named `privacy-scan / audit-privacy`. Once a ruleset on `main`
# marks that check required (P919 Phase 2, founder-only), a direct push of un-checked
# commits to `main` is rejected server-side (GH006) regardless of local hook state,
# --no-verify, core.hooksPath, or a rewritten local hook.
#
# Load-bearing design notes:
#  - The scanner is fetched FROM origin/main (the already-trusted copy), NOT the pushed
#    copy, so a scanner edit inside the push being scanned cannot weaken its own scan
#    (P919 residual mitigation b). Corollary: a NEW scanner pattern (e.g. the D6 canary
#    sentinel) is only active in CI once it has landed on main — the Layer-A falsification
#    dry-run (a throwaway branch carrying the sentinel) therefore must run AFTER this
#    branch merges to main, not before.
#  - This is a BLOCKING gate, never alert-only: no continue-on-error. The job must exit
#    non-zero to register a failed required check (contrast check-deploy-drift.yml, a monitor).
#  - permissions: contents: read ONLY. Actions auto-publishes the check-run result; a
#    fine-grained PAT cannot POST a check run, so the result is unforgeable (P919 D3/Security
#    Review). Do NOT add statuses:write or checks:write.

name: privacy-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit-privacy:
    name: audit-privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # full history — range computation needs origin/main reachable

      - name: Fetch trusted base (origin/main)
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin main:refs/remotes/origin/main \
            || git fetch --no-tags --quiet origin main

      - name: Compute scan range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REF_NAME: ${{ github.ref }}
        run: |
          set -euo pipefail
          . scripts/lib/privacy-scan-range.sh
          RANGE="$(privacy_scan_range "$EVENT_NAME" "$BEFORE_SHA" "$AFTER_SHA" "$PR_BASE_SHA" "$PR_HEAD_SHA" "$REF_NAME")"
          if [ "$RANGE" = "SKIP" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Branch deleted: nothing to scan."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "range=$RANGE" >> "$GITHUB_OUTPUT"
            echo "Computed scan range: $RANGE"
          fi

      - name: Privacy scan (trusted-base scanner, HEAD allowlist)
        if: steps.range.outputs.skip != 'true'
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          set -euo pipefail
          # Run the scanner AS IT EXISTS ON origin/main, not the pushed copy.
          git show origin/main:scripts/audit-privacy.sh > /tmp/trusted-audit.sh
          chmod +x /tmp/trusted-audit.sh
          # pipefail is mandatory: `script | tee` under bash -e otherwise returns tee's 0,
          # silently un-gating the scan (decisions.md 2026-06-06 [process]).
          set -o pipefail
          set +e
          bash /tmp/trusted-audit.sh "$RANGE" | tee scan-output.txt
          st=("${PIPESTATUS[@]}")
          rc=${st[0]}
          if [ "$rc" -eq 0 ] && [ "${st[1]}" -ne 0 ]; then rc=1; fi
          set -e
          # Exit 3 means the scanner could not read its input: a failure to scan, not a finding.
          if [ "$rc" -eq 3 ]; then
            echo "::error::Privacy scan could not read its input (exit 3). Nothing was verified."
          fi
          exit "$rc"

      - name: Allowlist co-commit guard (re-scan with base-SHA allowlists)
        if: steps.range.outputs.skip != 'true'
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          set -euo pipefail
          # Co-commit bypass: add an allowlist entry AND the PII it now covers in the SAME push.
          # The HEAD-allowlist scan (previous step) passes because the entry is present. Defeat it
          # by re-running with BOTH allowlists as they exist at the base SHA (origin/main) — an
          # entry added in this push is therefore not yet trusted. Covers:
          #   .privacy-allowlist        path allowlist (fail-CLOSED: absent base => everything scanned)
          #   .privacy-email-allowlist  third-party-email allowlist (P936; fail-OPEN: absent/empty
          #                             base => email check SKIPPED). The email half only closes the
          #                             bypass when the base list is non-empty-but-lacking-the-entry;
          #                             a first-ever creation of the email allowlist in the same push
          #                             inherits P936's fail-open and is not caught here (accepted,
          #                             consistent with P936 D2). Today's base list is non-empty.
          # P919 D2 step 4 / Security Review (decisions.md 2026-06-15 [technical], P936 follow-up).
          ALLOWLISTS=".privacy-allowlist .privacy-email-allowlist"
          changed=""
          for f in $ALLOWLISTS; do
            if git diff --name-only "$RANGE" -- "$f" | grep -q .; then
              changed="$changed $f"
            fi
          done
          if [ -z "$changed" ]; then
            echo "Neither allowlist changed in range — co-commit guard not triggered."
            exit 0
          fi
          echo "Allowlist(s) changed in range:$changed — re-scanning with base-SHA allowlists."
          # Back up HEAD copies, swap in origin/main's versions (empty if absent at base —
          # matches each file's documented absent/empty convention).
          BAK=$(mktemp -d)
          for f in $ALLOWLISTS; do
            [ -f "$f" ] && cp "$f" "$BAK/$f.bak" || true
            git show "origin/main:$f" > "$f" 2>/dev/null || : > "$f"
          done
          set +e
          set -o pipefail
          bash /tmp/trusted-audit.sh "$RANGE" | tee scan-output-base.txt
          rc=$?
          set -e
          # Restore HEAD copies so nothing downstream sees the swapped state.
          for f in $ALLOWLISTS; do
            [ -f "$BAK/$f.bak" ] && cp "$BAK/$f.bak" "$f" || true
          done
          if [ "$rc" -eq 3 ]; then
            echo "::error::Privacy scan could not read its input (exit 3) in the base-SHA re-scan. Nothing was verified."
            exit 3
          fi
          if [ "$rc" -ne 0 ]; then
            echo "❌ Privacy scan FAILED with the base-SHA allowlist(s) — an allowlist entry was added and matching PII committed in the same push."
            exit 1
          fi

      - name: Parity test (scanner unit tests, pushed copy)
        if: steps.range.outputs.skip != 'true'
        run: bash scripts/test-audit-privacy.sh

      - name: Dump scan output on failure
        if: failure()
        run: |
          echo "=== scan-output.txt ==="
          [ -f scan-output.txt ] && cat scan-output.txt || echo "(none)"
          echo "=== scan-output-base.txt ==="
          [ -f scan-output-base.txt ] && cat scan-output-base.txt || echo "(none)"
