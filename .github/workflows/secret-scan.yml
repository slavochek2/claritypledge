name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0  # Required for full-history scan

      - name: Install gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan diff (PR)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gitleaks detect \
            --no-banner \
            --redact \
            --log-opts="--no-merges ${BASE_SHA}..${HEAD_SHA}"

      - name: Scan diff (push to main)
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          # First push to a new branch has BEFORE_SHA=0000... — fall back to scanning the tip commit only.
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            gitleaks detect --no-banner --redact --log-opts="--no-merges -1 ${AFTER_SHA}"
          else
            gitleaks detect --no-banner --redact --log-opts="--no-merges ${BEFORE_SHA}..${AFTER_SHA}"
          fi
