name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0 # P1566: the quality ratchet compares against the range base

      # fetch-depth: 0 already brings origin/main; fetched again explicitly so the ratchet's
      # base never depends on checkout defaults (same step as closure-gate.yml).
      - name: Fetch base (origin/main)
        run: git fetch --no-tags --quiet origin main:refs/remotes/origin/main || git fetch --no-tags --quiet origin main

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      # P1563: no lifecycle scripts and no persisted checkout credential. The root postinstall
      # (git hooks, Playwright browser) is not needed here; tsc, eslint and vitest need none of the dependency install scripts.
      - name: Install dependencies
        run: npm ci --ignore-scripts --include=optional

      - name: TypeScript check (undeclared-identifier gate — P861)
        # Bare `npx tsc --noEmit` resolves the empty root solution tsconfig and
        # checks nothing (P861). Use the same gate as pre-commit so a green CI
        # check means "no undeclared identifiers (TS2304/2552/2582) in app code".
        run: bash scripts/typecheck-gate.sh

      - name: Lint
        run: npm run lint

      # P1566: blocks a change that makes code shape worse, never pre-existing debt. Runs
      # every metric registered in the runner's METRICS: the per-file size check (also run at
      # pre-commit) and the whole-project checks only CI can run. "Before" is the event
      # range's base, computed here, never a committed baseline: push to main judges
      # before..after, a PR judges merge-base..HEAD.
      - name: Quality ratchet (P1566)
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: node scripts/quality-ratchet.cjs --ci

      - name: Nested folder guides (P1566)
        run: node scripts/check-nested-guides.cjs --rev HEAD

      - name: Unit tests
        run: npm test -- --run
