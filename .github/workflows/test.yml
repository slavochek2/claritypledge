name: CI

on:
  push:
    # P1635: 'staging/**' is the hop every landing transits (docs/technical/git-workflow.md), so the
    # full suite runs on the exact SHAs that get promoted. Job id `test` is the check name that
    # scripts/lib-required-checks.sh (UNIT_CHECK_CONTEXT) waits for and prints at promotion.
    branches: [main, 'staging/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      # P1563: no lifecycle scripts and no persisted checkout credential. The root postinstall
      # (git hooks, Playwright browser) is not needed here; tsc, eslint and vitest need none of the dependency install scripts.
      - name: Install dependencies
        run: npm ci --ignore-scripts --include=optional

      - name: TypeScript check (undeclared-identifier gate — P861)
        # Bare `npx tsc --noEmit` resolves the empty root solution tsconfig and
        # checks nothing (P861). Use the same gate as pre-commit so a green CI
        # check means "no undeclared identifiers (TS2304/2552/2582) in app code".
        run: bash scripts/typecheck-gate.sh

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --run
