# Gitleaks configuration - ignore known false positives
# See: https://github.com/gitleaks/gitleaks#configuration

[extend]
useDefault = true

# Allowlist for known false positives
[allowlist]
  description = "Known safe patterns in this codebase"

  # Historical secret-scan findings — every one verified DEAD (credential rotated;
  # current value differs from the leaked value) or PUBLIC-BY-DESIGN (Supabase anon key).
  # These commits are frozen in history, so allowlisting them never blinds detection of
  # new work. Full per-finding dead/live map: .private/docs/security-incidents.md
  commits = [
    "5d3b55b4e2d08f916f6ee4e5a9f9494a5073a160",  # .env.prod.example — DB pw (rotated)
    "e8f3e39121de5d8ee1c0660f136617efaa538676",  # setup-verify-listener.ts — test login pw (changed)
    "b886540753ad0707f606f6bfa6fe787f44cf38ce",  # archived migrations — test DB pw (rotated)
    "0af0f11b927e5b850618eba0eda5ae77046a6311",  # scripts — Supabase anon key (public by design)
    "03ad9743ff23acbc3ffbdcd156e5fe67c7071e45",  # telegram-command-handler.py — bot token (rotated)
  ]

  # React state setter functions that match LinkedIn patterns
  regexTarget = "match"
  regexes = [
    '''setLinkedin\w+''',           # setLinkedinUrl, setLinkedinError, etc.
    '''linkedinUrl''',              # LinkedIn URL field (user input, not API key)
    '''linkedinError''',            # Error state variable
    '''5c88ffaa-4e5a-4c82-9c73-e7fb0ad3ad01''',  # Web3Forms access key (intentionally public)
    # Supabase JWT placeholder pattern — header-only followed by literal ellipsis
    '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.\.\.''',
    '''eyJhbGciOiJI\.\.\.''',       # Even-shorter ellipsis placeholder
  ]

  # Paths that contain intentionally public keys or example values
  paths = [
    '''^scripts/audit-credential-drift\.test\.sh$''',  # P1147 — synthetic FAKE_*/PEM-shaped fixtures by design; see file header
    '''dist/''',                    # Build output (contains minified code with variable names)
    '''\.map$''',                   # Source maps
    '''\.env\.local$''',            # Local env files (gitignored)
    '''\.env\.test\.local$''',      # Test env files (gitignored)
    '''\.mcp\.json$''',             # MCP config (gitignored, local only)
    '''\.bmad/''',                  # BMAD config (contains file hashes, not secrets)
    '''features/_drafts/''',        # Draft docs with example values (historical, absent at HEAD)
    '''features/drafts/''',         # Draft docs with example values
    '''features/done/''',           # Archived docs with example values
  ]

# Specific rules to ignore entirely
# These trigger on patterns that are safe in frontend apps
[[rules]]
  id = "linkedin-client-id"
  description = "LinkedIn Client ID - disabled (false positives on variable names)"
  regex = '''(?i)linkedin.{0,20}client.{0,20}id'''
  keywords = ["linkedin"]
  [rules.allowlist]
    regexTarget = "match"
    regexes = ['''.*''']  # Allow all matches (effectively disables this rule)

[[rules]]
  id = "linkedin-client-secret"
  description = "LinkedIn Client Secret - disabled (false positives on variable names)"
  regex = '''(?i)linkedin.{0,20}client.{0,20}secret'''
  keywords = ["linkedin"]
  [rules.allowlist]
    regexTarget = "match"
    regexes = ['''.*''']

# Note: The following are intentionally public (client-side keys by design):
# - Supabase anon key (RLS policies protect data)
# - Mixpanel token (analytics, client-side by design)
# - Web3Forms access key (designed to be public, like Stripe publishable keys)
# These are documented in CLAUDE.md under "Technical Debt / Intentional Decisions"

[[rules]]
  id = "connection-string-credentials"
  description = "Catches database connection strings with embedded credentials (postgresql://, mongodb://, etc.)"
  regex = '''(?i)(postgres(?:ql)?|mongodb|mysql|redis|amqp)://[^:/?#]+:[^@/?#]{8,}@'''
  keywords = ["postgresql", "postgres", "mongodb", "mysql", "redis", "amqp"]
  [rules.allowlist]
    regexTarget = "match"
    regexes = [
      '''YOUR_''',              # Placeholder pattern
      '''CHANGE_ME''',          # Placeholder pattern
      '''\[PASSWORD\]''',       # Doc template pattern
      '''PASSWORD_HERE''',      # Placeholder pattern
      '''://user:PASSWORD@''',  # Doc syntax (e.g. in migrate.sh comments)
      '''://[^:/?#]+:PASSWORD@''',  # Generic doc syntax with literal PASSWORD
      '''example\.com''',       # Example hostnames
      '''xxx{2,}''',            # Redacted patterns
    ]

[[rules]]
  id = "hardcoded-password-assignment"
  description = "Catches hardcoded password values in variable assignments (e.g. const PASSWORD = 'abc123')"
  regex = '''(?i)(password|passwd|pwd)\s*=\s*['"][^'"]{8,}['"]'''
  keywords = ["password", "passwd", "pwd"]
  [rules.allowlist]
    paths = ['''e2e/''']  # E2E test helpers use known test passwords (not real credentials)

# HuggingFace access token (hf_...). Layer 1 catch — gitleaks' default ruleset has no
# hf_ rule. services/transcribe reads HF_TOKEN for gated pyannote models (config.py),
# so this is the most likely hardcoded secret in the services/ tree. P868 excludes
# services/ from the Layer-2a grep backstop, so this rule restores coverage at Layer 1
# (and closes the same pre-existing blind spot for src/, scripts/, api/).
[[rules]]
  id = "huggingface-access-token"
  description = "HuggingFace access token (hf_... — gated model auth)"
  regex = '''hf_[A-Za-z0-9]{34,}'''
  keywords = ["hf_"]
  [rules.allowlist]
    regexTarget = "match"
    regexes = [
      '''hf_[xX]{20,}''',                 # placeholder tokens (hf_xxxxxxxx…)
      '''hf_[A-Za-z0-9]*(EXAMPLE|EXMPL)''',  # documentation example tokens
    ]
