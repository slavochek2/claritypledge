<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/clarity-favicon.svg" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to resolve to non-zero
         values; without it the bottom nav and other fixed-bottom UI are clipped behind the
         Android/iOS system bar in the standalone PWA (P956). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- P553: Preconnect to critical third-party origins -->
    <link rel="preconnect" href="https://besjtuodziykmjidubzw.supabase.co" />
    <!-- P555: Google Fonts preconnects removed — fonts self-hosted in /fonts/ -->

    <!-- Primary Meta Tags -->
    <title>Clarity Pledge - Commit to Clear Communication</title>
    <meta name="title" content="Clarity Pledge - Commit to Clear Communication" />
    <meta name="description" content="Join professionals worldwide in a public commitment to clear, honest communication. Sign the pledge, get your shareable certificate, and collect endorsements from colleagues." />
    <meta name="keywords" content="clarity pledge, clear communication, professional commitment, workplace communication, transparency, honesty" />
    <meta name="author" content="Clarity Pledge" />
    <link rel="canonical" href="https://claritypledge.com/" />

    <!-- Open Graph / Twitter: managed by react-helmet-async (SEO component).
         Static defaults here would conflict — Helmet adds new tags instead of replacing. -->

    <!-- Additional SEO -->
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow, max-video-preview:-1, max-image-preview:large, max-snippet:-1" />

    <!-- PWA (manifest injected by vite-plugin-pwa) -->
    <meta name="theme-color" content="#3b82f6" />

    <!-- iOS PWA Support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Clarity" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />

    <!-- Structured Data -->
    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "https://claritypledge.com/#organization",
      "name": "Clarity Pledge",
      "url": "https://claritypledge.com",
      "logo": {
        "@type": "ImageObject",
        "url": "https://claritypledge.com/clarity-pledge-icon.png"
      },
      "sameAs": []
    },
    {
      "@type": "WebSite",
      "@id": "https://claritypledge.com/#website",
      "url": "https://claritypledge.com",
      "name": "Clarity Pledge",
      "description": "Calibrated communication practice for coaches and professionals",
      "publisher": {
        "@id": "https://claritypledge.com/#organization"
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://claritypledge.com/clarity-champions?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
  ]
}
    </script>
