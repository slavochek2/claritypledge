<!doctype html>
<!--
  messenger-card.html — the portrait invite card attached to WhatsApp/Telegram group posts and warm DMs.
  Founder-approved on Clarity Night #2 (2026-10-02). Skill: /slava:events:messenger-card.

  WHY. Most people in a group never read the caption. The card alone must say what, who, when, where,
  free, and how to register. Portrait 4:5 (1080x1350) because a tall image fills the phone screen in
  WhatsApp/Telegram while a wide banner shows as a thin strip. QR is small and in a corner: nobody can
  scan the screen they are looking at; it is for forwards, laptops and screenshots. The tap target is
  the link in the caption.

  USE. Copy into a scratch folder next to `banner.png` (the event banner, 2400x1143, from the
  event-banners bucket) and `qr.png` (600x600, bg FBFAF6, fg 1B2A3A, encoding the per-event short link
  with ?d=YYMMDD). Edit ONLY the JSON block. Render with headless Chrome at 1080x1350, then READ the
  output image and fix crops before showing it to the founder.

  `tiles`: one entry per banner element (emblem first, then each face). `x`/`y` are the top-left of a
  330x292 crop in banner pixels. On the lineup-banner template the band sits at y≈400-720 and the
  emblem + faces are spread across x≈240-2150; start from evenly spaced x and adjust by eye. Three per
  row; any count works.
-->
<html><head><meta charset="utf-8"><style>
body{margin:0;width:1080px;height:1350px;background:#fbfaf6;font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;color:#1B2A3A;overflow:hidden;position:relative}
.top{text-align:center;padding-top:54px}
.label{font-size:30px;letter-spacing:6px;font-weight:700;color:#3b82f6}
.title{font-size:84px;font-weight:800;margin-top:14px;line-height:1}
.q{font-size:36px;color:#4A5563;margin:18px 90px 0;line-height:1.3}
.grid{display:flex;flex-wrap:wrap;justify-content:center;margin:18px auto 0;width:990px}
.f{width:330px;height:292px;background:url(banner.png) no-repeat}
.info{text-align:center;margin-top:24px}
.when{font-size:52px;font-weight:800}
.where{font-size:34px;color:#4A5563;margin-top:10px}
.free{display:inline-block;margin-top:22px;font-size:30px;color:#1d4ed8;background:#eff6ff;border:2px solid #bfdbfe;border-radius:999px;padding:10px 28px}
.bottom{position:absolute;left:70px;right:70px;bottom:40px;display:flex;align-items:center;gap:30px;border-top:2px solid #e5e2da;padding-top:24px}
.bottom img{width:150px;height:150px}
.reg{font-size:30px;color:#4A5563;line-height:1.35}.reg b{color:#1B2A3A;font-size:38px}
</style></head><body>
<script type="application/json" id="card">
{
  "label": "CLARITY NIGHT",
  "title": "AI and Your Ikigai",
  "hook": "Does AI help you do what you love, or take it away? Five thinkers disagree. Where do you stand?",
  "tiles": [
    {"x": 243, "y": 400}, {"x": 555, "y": 420}, {"x": 872, "y": 420},
    {"x": 1189, "y": 420}, {"x": 1505, "y": 420}, {"x": 1821, "y": 420}
  ],
  "when": "Tue 6 Oct · 18:30",
  "where": "Zuzalu Library, 4Seas Nimman, Chiang Mai",
  "pill": "Free · No background needed · Everyone welcome",
  "cta": "Scan or tap the link to register",
  "link": "claritypledge.com/night"
}
</script>
<div class="top"><div class="label" id="label"></div><div class="title" id="title"></div><div class="q" id="hook"></div></div>
<div class="grid" id="grid"></div>
<div class="info"><div class="when" id="when"></div><div class="where" id="where"></div><div class="free" id="pill"></div></div>
<div class="bottom"><img src="qr.png"><div class="reg"><span id="cta"></span><br><b id="link"></b></div></div>
<script>
const c=JSON.parse(document.getElementById('card').textContent);
for (const k of ['label','title','hook','when','where','pill','cta','link']) document.getElementById(k).textContent=c[k];
const g=document.getElementById('grid');
for (const t of c.tiles){const d=document.createElement('div');d.className='f';d.style.backgroundPosition=`-${t.x}px -${t.y}px`;g.appendChild(d);}
</script>
</body></html>
